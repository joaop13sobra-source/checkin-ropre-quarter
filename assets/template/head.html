<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --v4-red: #e50914;
      --v4-red-hover: #c40712;
      --v4-orange: #ff481f;
      --v4-flame: #f0141e;
      --v4-dark: #280001;
      --v4-darker: #280000;
      --v4-grey: #e1dcdc;
      --v4-white: #ffffff;
      --v4-cream: #ffebc8;
      --v4-salmon: #ffb4a0;
      --ink: #141414;
      --ink-soft: #5a5a5a;
      --line: rgba(20, 20, 20, .12);
      --radius: 22px;
      --radius-pill: 999px;
      --hero: radial-gradient(120% 130% at 50% -10%, #ff5a2c 0%, #e50914 30%, #b00610 62%, #280001 100%);
      --safe: #1e8a4c;
      --care: #b06400;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171313;
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button { font-family: inherit; }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(229, 9, 20, .18), transparent 38%),
        #171313;
    }

    #deck {
      --deck-scale: 1;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--deck-scale));
      transform-origin: center;
      background: #f5f4f2;
      box-shadow: 0 40px 120px rgba(0, 0, 0, .45);
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      padding: 76px 96px 108px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity .28s ease, transform .28s ease;
      background:
        radial-gradient(circle at 92% 8%, rgba(229, 9, 20, .055), transparent 24%),
        #f5f4f2;
    }

    .slide.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
    .slide.red { color: white; background: var(--hero); }
    .slide.dark {
      color: white;
      background:
        radial-gradient(circle at 78% 15%, rgba(229, 9, 20, .5), transparent 32%),
        linear-gradient(145deg, #280001 0%, #130001 100%);
    }
    .slide.white { background: white; }

    .topline {
      position: absolute; top: 0; left: 0; width: 100%; height: 5px;
      background: linear-gradient(90deg, var(--v4-red), var(--v4-orange), transparent 76%);
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 24px; font-size: 88px; line-height: .98; letter-spacing: -.055em; font-weight: 600; }
    h2 { margin-bottom: 18px; font-size: 58px; line-height: 1.03; letter-spacing: -.04em; font-weight: 600; }
    h3 { margin-bottom: 10px; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; font-weight: 600; }

    .lede { max-width: 1000px; color: var(--ink-soft); font-size: 25px; line-height: 1.42; font-weight: 300; }
    .red .lede, .dark .lede { color: rgba(255, 255, 255, .72); }
    .accent { color: var(--v4-red); }
    .red .accent, .dark .accent { color: var(--v4-cream); }
    .mono { font-family: "IBM Plex Mono", monospace; }

    .eyebrow {
      display: inline-flex; align-items: center; min-height: 34px; padding: 7px 15px;
      border: 1px solid rgba(229, 9, 20, .18); border-radius: var(--radius-pill);
      color: var(--v4-red); background: rgba(229, 9, 20, .07);
      font-size: 12px; line-height: 1; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    }
    .red .eyebrow, .dark .eyebrow {
      color: rgba(255, 255, 255, .92); background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .35);
      box-shadow: inset 0 0 80px rgba(255, 255, 255, .12), inset 0 1px 8px rgba(255, 255, 255, .35), -5px 5px 20px rgba(0, 0, 0, .10);
      backdrop-filter: blur(14px) saturate(140%);
    }

    .card { position: relative; padding: 28px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: white; }
    .card.on-dark { border-color: rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .08); color: white; backdrop-filter: blur(14px) saturate(140%); }
    .card.on-dark .metric-label { color: rgba(255, 255, 255, .68); }
    .card.on-dark .big-number { color: var(--v4-cream); }

    .sphere {
      position: absolute; border: 1px solid rgba(255, 255, 255, .24); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .38), rgba(255, 255, 255, .045) 48%, transparent 66%);
      box-shadow: inset 0 0 120px rgba(255, 255, 255, .13), inset 25px 18px 70px rgba(255, 160, 70, .28);
      backdrop-filter: blur(3px);
    }

    .icon { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .icon-box {
      width: 58px; height: 58px; display: grid; place-items: center; flex: 0 0 auto;
      border: 1px solid rgba(229, 9, 20, .18); border-radius: 17px; color: var(--v4-red); background: rgba(229, 9, 20, .07);
    }
    .red .icon-box, .dark .icon-box { color: white; border-color: rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .08); }
    .icon-box.small { width: 46px; height: 46px; border-radius: 13px; }
    .icon-box.small .icon { width: 22px; height: 22px; }
    .icon-box.safe { color: var(--safe); border-color: rgba(30, 138, 76, .25); background: rgba(30, 138, 76, .08); }
    .icon-box.care { color: var(--care); border-color: rgba(176, 100, 0, .25); background: rgba(176, 100, 0, .08); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

    .menu-row { display: flex; gap: 10px; }
    .menu-num {
      width: 96px; flex: 0 0 auto; border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font: 700 34px "IBM Plex Mono", monospace; color: rgba(255,255,255,.32);
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    }
    .menu-num.active { color: white; background: var(--v4-red); border-color: var(--v4-red); }
    .menu-card {
      flex: 1; border-radius: 18px; padding: 16px 26px; display: flex; flex-direction: column; justify-content: center;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    }
    .menu-card.active { background: linear-gradient(135deg, #ff4d3d, var(--v4-red)); border-color: transparent; }
    .menu-card h3 { margin: 0; font-size: 25px; font-weight: 700; color: rgba(255,255,255,.55); }
    .menu-card.active h3 { color: white; }
    .menu-card .subs { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
    .menu-card .subs div { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.32); }
    .menu-card.active .subs div { color: rgba(255,255,255,.9); }
    .menu-card .subs div::before { content: "\2022  "; }
    .menu-hero-eyebrow { font-size: 19px; color: rgba(255,255,255,.68); margin-bottom: 6px; }
    .menu-hero-title { font-size: 68px; line-height: 1.06; font-weight: 800; color: white; margin: 0; }

    .big-number { color: var(--v4-red); font-size: 72px; line-height: 1; letter-spacing: -.06em; font-weight: 700; }
    .big-number.mid { font-size: 46px; }
    .big-number.sm { font-size: 34px; }
    .metric-label { margin-top: 8px; color: var(--ink-soft); font-size: 16px; line-height: 1.2; }
    .metric-sub { margin-top: 6px; }

    .bullet-list { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
    .bullet-list li { display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 14px 18px; border: 1px solid rgba(20, 20, 20, .08); border-radius: 17px; background: rgba(255, 255, 255, .74); font-size: 21px; line-height: 1.2; }
    .dark .bullet-list li, .red .bullet-list li { border-color: rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .92); }
    .bullet-list.compact li { min-height: 0; padding: 16px 20px; align-items: flex-start; }
    .bullet-list.compact .icon-box { margin-top: 2px; }
    .bullet-list .bullet-text { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .bullet-list .bullet-text strong { font-size: 21px; }
    .bullet-list .bullet-text span { font-size: 17px; font-weight: 300; color: var(--ink-soft); }
    .dark .bullet-list .bullet-text span, .red .bullet-list .bullet-text span { color: rgba(255, 255, 255, .68); }

    .deliver-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
    .deliver-card { position: relative; display: flex; gap: 15px; align-items: flex-start; padding: 15px 20px 15px 25px; border-radius: 16px; background: white; border: 1px solid var(--line); box-shadow: 0 8px 20px rgba(20,20,20,.045); }
    .deliver-card::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: var(--safe); }
    .deliver-card.pending::before { background: var(--care); }
    .deliver-card .icon-box { flex-shrink: 0; }
    .deliver-card .dc-text { flex: 1; min-width: 0; }
    .deliver-card .dc-text strong { display: block; font-size: 16.5px; font-weight: 700; color: var(--ink); line-height: 1.28; }
    .deliver-card .dc-text span { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-soft); line-height: 1.35; font-weight: 400; }

    .rank-card h3 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
    .rank-card .rank-sub { font-size: 12.5px; font-weight: 700; color: var(--v4-red); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .rank-list { display: flex; flex-direction: column; gap: 7px; }
    .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; background: rgba(20,20,20,.035); }
    .rank-pos { flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--v4-red); color: white; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; }
    .rank-name { flex: 1; font-size: 12.5px; color: var(--ink); line-height: 1.3; }
    .rank-count { font-family: "IBM Plex Mono", monospace; font-weight: 700; color: var(--v4-red); font-size: 13.5px; white-space: nowrap; }
    .rank-frac { font-family: "IBM Plex Mono", monospace; color: var(--ink-soft); font-size: 10.5px; white-space: nowrap; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 12px; border-radius: var(--radius-pill);
      font: 700 12px/1 "IBM Plex Mono", monospace; letter-spacing: .04em; text-transform: uppercase;
    }
    .status-pill.safe { color: var(--safe); background: rgba(30, 138, 76, .1); }
    .status-pill.care { color: var(--care); background: rgba(176, 100, 0, .1); }
    .status-pill.danger { color: var(--v4-red); background: rgba(229, 9, 20, .1); }

    .data-table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
    .data-table th { padding: 12px 14px; border-bottom: 2px solid var(--v4-red); color: var(--ink); font: 700 11.5px/1 "IBM Plex Mono", monospace; letter-spacing: .05em; text-transform: uppercase; text-align: left; }
    .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--line); color: var(--ink-soft); vertical-align: middle; }
    .data-table td strong { color: var(--ink); font-weight: 600; }
    .data-table tr.total td { border-bottom: none; border-top: 2px solid var(--ink); color: var(--ink); font-weight: 700; }
    .data-table td.num { font-family: "IBM Plex Mono", monospace; font-size: 14.5px; }
    .data-table td.good { color: var(--safe); font-weight: 700; }
    .data-table td.bad { color: var(--v4-red); font-weight: 700; }
    .data-table td.muted { color: rgba(90, 90, 90, .55); font-style: italic; }
    .data-table.tight td { padding: 8px 12px; font-size: 14px; }
    .data-table.tight th { padding: 9px 12px; }

    .cover-content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    .brand-lockup { display: flex; align-items: center; gap: 26px; }
    .brand-lockup img { width: 330px; display: block; object-fit: contain; }
    .eyebrow-logo { display: inline-flex; align-items: center; margin-bottom: 8px; }
    .eyebrow-logo { background:#fff; border-radius:22px; padding:16px 30px; box-shadow:0 14px 40px rgba(0,0,0,.28); }
    .eyebrow-logo img { height: 110px; width: auto; display: block; object-fit: contain; }
    .cover-subtitle { margin: 14px 0 0; font-size: 24px; font-weight: 500; color: rgba(255, 255, 255, .82); }
    .cover-title { max-width: 1100px; margin: 28px 0 0; font-size: 92px; }

    .shot-frame { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: white; box-shadow: 0 20px 60px rgba(0, 0, 0, .14); }
    .shot-frame img { display: block; width: 100%; height: auto; }

    .dual-funnel { display: flex; gap: 24px; margin-top: 22px; }
    .df-panel { flex: 1; background: white; border: 1px solid var(--line); border-radius: 20px; padding: 26px 28px; }
    .df-panel h3 { font-size: 19px; font-weight: 700; color: var(--ink); margin: 0 0 16px; }
    .df-chips { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .df-chip { flex: 1; min-width: 110px; background: rgba(20,20,20,.035); border-radius: 12px; padding: 11px 15px; }
    .df-chip .cl { display: block; font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
    .df-chip .cv { display: block; font-size: 18px; font-weight: 700; color: var(--ink); margin-top: 4px; }
    .df-chip .cv.accent { color: var(--safe); }
    .df-row { display: flex; align-items: center; gap: 12px; margin-top: 13px; }
    .df-row:first-child { margin-top: 0; }
    .df-label { flex: 0 0 56px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .df-bar-wrap { flex: 1; position: relative; height: 34px; border-radius: 8px; background: rgba(20,20,20,.05); overflow: hidden; }
    .df-bar { height: 100%; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-weight: 700; color: white; font-size: 14.5px; }
    .df-rate { flex: 0 0 44px; font-size: 11.5px; color: var(--ink-soft); text-align: right; }
    .df-cost { flex: 0 0 88px; text-align: right; }
    .df-cost .cl { display: block; font-family: "IBM Plex Mono", monospace; font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
    .df-cost .cv { font-size: 12.5px; font-weight: 700; color: var(--v4-red); }

    .evo-legend { display: flex; gap: 28px; margin-top: 22px; }
    .evo-legend-item { display: flex; align-items: center; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .85); }
    .evo-swatch-bar { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, #ff7a3c, #7a0f10); }
    .evo-swatch-line { position: relative; width: 22px; height: 3px; border-radius: 2px; background: #fff; }
    .evo-swatch-line::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
    .evo-chart { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: 12px; overflow: hidden; }
    .evo-svg { width: auto; height: 100%; max-width: 100%; display: block; }
    .evo-grid { stroke: rgba(255, 255, 255, .14); stroke-width: 1; }
    .evo-bar-value { font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 700; fill: #fff; stroke: rgba(0, 0, 0, .4); stroke-width: 3px; paint-order: stroke fill; }
    .evo-month-label { font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 700; fill: rgba(255, 255, 255, .92); }
    .evo-sub-label { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500; fill: rgba(255, 255, 255, .58); }
    .evo-line { fill: none; stroke: #fff; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .evo-dot { fill: #fff; stroke: #7a0f10; stroke-width: 2; }
    .evo-line-value { font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 700; fill: #fff; stroke: rgba(0, 0, 0, .4); stroke-width: 3px; paint-order: stroke fill; }
    .evo-footnote { margin-top: 14px; max-width: 1408px; font-size: 14.5px; line-height: 1.45; font-weight: 300; color: rgba(255, 255, 255, .62); }

    .pending-banner {
      display: flex; align-items: center; gap: 20px; margin-top: 22px; padding: 20px 28px;
      border: 1px dashed rgba(176, 100, 0, .4); border-radius: var(--radius); background: rgba(176, 100, 0, .06);
    }
    .pending-banner strong { display: block; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
    .pending-banner span { font-size: 15px; color: var(--ink-soft); line-height: 1.4; }

    .slide-footer { position: absolute; z-index: 8; left: 96px; right: 96px; bottom: 32px; height: 48px; display: flex; align-items: center; pointer-events: none; }
    .slide-footer img { width: 155px; height: 48px; object-fit: contain; object-position: left center; }

    .navigation { position: absolute; z-index: 20; right: 52px; bottom: 25px; display: flex; align-items: center; gap: 10px; }
    .nav-btn { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid rgba(20, 20, 20, .12); border-radius: 50%; color: var(--ink); background: rgba(255, 255, 255, .92); box-shadow: 0 10px 30px rgba(0, 0, 0, .12); cursor: pointer; transition: transform .15s ease, background .15s ease, opacity .15s ease; }
    .nav-btn:hover { transform: translateY(-2px); background: white; }
    .nav-btn:disabled { opacity: .3; cursor: default; transform: none; }

    .progress-track { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(20, 20, 20, .1); }
    .progress-fill { width: 50%; height: 100%; background: linear-gradient(90deg, var(--v4-red), var(--v4-orange)); box-shadow: 0 0 20px rgba(229, 9, 20, .35); transition: width .3s ease; }
    .slide-counter { position: absolute; z-index: 22; right: 176px; bottom: 39px; color: rgba(20, 20, 20, .52); font: 500 12px/1 "IBM Plex Mono", monospace; letter-spacing: .04em; }

    .slide.vfill { display: flex; flex-direction: column; align-items: stretch; }
    .slide.vfill > .eyebrow { align-self: flex-start; }
    .slide.vfill > .fill { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  
    .dl { display:block; font:600 11.5px/1.25 "IBM Plex Mono",monospace; margin-top:4px; }
    .dl.g { color:var(--safe); } .dl.r { color:var(--v4-red); }
    .fx-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .smart-kr li { min-height:0; padding:9px 16px; gap:14px; font-size:19px; }
    .smart-kr .bullet-text { gap:3px; } .smart-kr .bullet-text span { font-size:15px; color:var(--ink-soft); }
    .smart-kr .icon-box.small { width:40px; height:40px; }
    .mql9 th { padding:9px 12px; font-size:11px; } .mql9 td { padding:8px 12px; font-size:14px; line-height:1.28; } .mql9 td.num { font-size:13px; }
    .fx-fin { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .fx-wrap { background:#fff; border:1px solid var(--line); border-radius:20px; padding:10px 22px 12px; box-shadow:0 8px 20px rgba(20,20,20,.045); }
    .fx-head, .fx-row { display:grid; grid-template-columns:70px 1fr 250px 270px; gap:20px; align-items:center; }
    .fx-head small { display:block; margin-top:3px; font-weight:500; letter-spacing:.03em; text-transform:none; }
    .fx-head { font:700 11px/1 "IBM Plex Mono",monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding:6px 0 8px; border-bottom:2px solid var(--v4-red); }
    .fx-row { padding:8px 0; border-bottom:1px solid var(--line); } .fx-row:last-child { border-bottom:none; }
    .fx-label { font-weight:700; font-size:15px; }
    .fx-bar-wrap { height:38px; border-radius:9px; background:rgba(20,20,20,.05); overflow:hidden; }
    .fx-bar { height:100%; border-radius:9px; display:flex; align-items:center; padding:0 14px; font-weight:700; color:#fff; font-size:17px; }
    .fx-d b, .fx-rate b, .fx-cost b { display:block; font-size:19px; font-weight:700; color:var(--ink); }
    .fx-cost .cl { font:700 10.5px/1 "IBM Plex Mono",monospace; color:var(--ink-soft); letter-spacing:.06em; }
    .cmp-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .cmp-top b { font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-.02em; }
